format: "replit.sdm"
version: 1
size:
  width: 1920
  height: 1080
background:
  kind: "solid"
  color:
    kind: "token"
    token: "background"
theme:
  colors:
    background: "#F8F6F1"
    surface: "#FCFAF8"
    foreground: "#3D3129"
    muted: "#847062"
    accent: "#50A63F"
    secondary: "#B27334"
  fonts:
    display: "Outfit"
    body: "Nunito"
elements:
  -
    id: "headerBar"
    type: "shape"
    frame:
      x: 120
      y: 87
      width: 100
      height: 8
    geometry:
      kind: "preset"
      preset: "rect"
    fill:
      kind: "solid"
      color:
        kind: "token"
        token: "accent"
  -
    id: "chapter"
    type: "text"
    frame:
      x: 240
      y: 67
      width: 850
      height: 45
    body:
      paragraphs:
        -
          runs:
            -
              text: "COMPOST HEROES  /  OPEN PLAY"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 16
            weight: 700
            color:
              kind: "token"
              token: "muted"
          lineHeight: 1.25
  -
    id: "heading"
    type: "text"
    frame:
      x: 120
      y: 130
      width: 1680
      height: 200
    body:
      paragraphs:
        -
          runs:
            -
              text: "What did the game reveal?"
          defaultRunStyle:
            font:
              kind: "token"
              token: "display"
            sizePt: 42
            weight: 700
            color:
              kind: "token"
              token: "foreground"
          lineHeight: 1.09
  -
    id: "footer"
    type: "text"
    frame:
      x: 120
      y: 1004
      width: 440
      height: 44
    body:
      paragraphs:
        -
          runs:
            -
              text: "A GREEN CAMPS PROJECT"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 16
            weight: 700
            color:
              kind: "token"
              token: "muted"
          lineHeight: 1.25
  -
    id: "page"
    type: "text"
    frame:
      x: 1660
      y: 1004
      width: 150
      height: 44
    body:
      paragraphs:
        -
          runs:
            -
              text: "11 / 12"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 16
            weight: 400
            color:
              kind: "token"
              token: "muted"
          lineHeight: 1.25
  -
    id: "reflectPanel"
    type: "shape"
    frame:
      x: 120
      y: 310
      width: 1680
      height: 620
    geometry:
      kind: "preset"
      preset: "roundRect"
      cornerRadius: 24
    fill:
      kind: "solid"
      color:
        kind: "token"
        token: "surface"
  -
    id: "questions"
    type: "text"
    frame:
      x: 175
      y: 374
      width: 1575
      height: 525
    body:
      paragraphs:
        -
          runs:
            -
              text: "What did you need to balance to make progress?"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 27
            color:
              kind: "token"
              token: "foreground"
          lineHeight: 1.28
          spaceAfterPt: 14
        -
          runs:
            -
              text: "How did another player’s choices change your plan?"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 27
            color:
              kind: "token"
              token: "foreground"
          lineHeight: 1.28
          spaceAfterPt: 14
        -
          runs:
            -
              text: "What helped your group work through uncertainty?"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 27
            color:
              kind: "token"
              token: "foreground"
          lineHeight: 1.28
          spaceAfterPt: 14
        -
          runs:
            -
              text: "Where do you see a similar challenge at camp?"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 27
            color:
              kind: "token"
              token: "foreground"
          lineHeight: 1.28
          spaceAfterPt: 14
        -
          runs:
            -
              text: "Share one insight you want to bring back to your team."
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 27
            color:
              kind: "token"
              token: "foreground"
          lineHeight: 1.28
          spaceAfterPt: 14
