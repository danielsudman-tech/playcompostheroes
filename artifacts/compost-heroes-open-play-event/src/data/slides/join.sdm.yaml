format: "replit.sdm"
version: 1
size:
  width: 1920
  height: 1080
background:
  kind: "solid"
  color:
    kind: "token"
    token: "background"
theme:
  colors:
    background: "#F8F6F1"
    surface: "#FCFAF8"
    foreground: "#3D3129"
    muted: "#847062"
    accent: "#50A63F"
    secondary: "#B27334"
  fonts:
    display: "Outfit"
    body: "Nunito"
elements:
  -
    id: "headerBar"
    type: "shape"
    frame:
      x: 120
      y: 87
      width: 100
      height: 8
    geometry:
      kind: "preset"
      preset: "rect"
    fill:
      kind: "solid"
      color:
        kind: "token"
        token: "accent"
  -
    id: "chapter"
    type: "text"
    frame:
      x: 240
      y: 67
      width: 850
      height: 45
    body:
      paragraphs:
        -
          runs:
            -
              text: "COMPOST HEROES  /  OPEN PLAY"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 16
            weight: 700
            color:
              kind: "token"
              token: "muted"
          lineHeight: 1.25
  -
    id: "heading"
    type: "text"
    frame:
      x: 120
      y: 130
      width: 1680
      height: 200
    body:
      paragraphs:
        -
          runs:
            -
              text: "Join your assigned table"
          defaultRunStyle:
            font:
              kind: "token"
              token: "display"
            sizePt: 42
            weight: 700
            color:
              kind: "token"
              token: "foreground"
          lineHeight: 1.09
  -
    id: "footer"
    type: "text"
    frame:
      x: 120
      y: 1004
      width: 440
      height: 44
    body:
      paragraphs:
        -
          runs:
            -
              text: "A GREEN CAMPS PROJECT"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 16
            weight: 700
            color:
              kind: "token"
              token: "muted"
          lineHeight: 1.25
  -
    id: "page"
    type: "text"
    frame:
      x: 1660
      y: 1004
      width: 150
      height: 44
    body:
      paragraphs:
        -
          runs:
            -
              text: "09 / 12"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 16
            weight: 400
            color:
              kind: "token"
              token: "muted"
          lineHeight: 1.25
  -
    id: "urlPanel"
    type: "shape"
    frame:
      x: 120
      y: 290
      width: 1680
      height: 155
    geometry:
      kind: "preset"
      preset: "roundRect"
      cornerRadius: 24
    fill:
      kind: "solid"
      color:
        kind: "token"
        token: "surface"
  -
    id: "playUrl"
    type: "text"
    frame:
      x: 160
      y: 310
      width: 1570
      height: 110
    body:
      paragraphs:
        -
          runs:
            -
              text: "Open play.compostheroes.org."
              action:
                kind: "openUrl"
                url: "https://play.compostheroes.org/"
                target: "newWindow"
          defaultRunStyle:
            font:
              kind: "token"
              token: "display"
            sizePt: 36
            weight: 700
            color:
              kind: "token"
              token: "accent"
          lineHeight: 1.09
  -
    id: "joinSteps"
    type: "text"
    frame:
      x: 120
      y: 500
      width: 1680
      height: 475
    body:
      paragraphs:
        -
          runs:
            -
              text: "Use the table or event link—or room code—shared by your host."
          bullet:
            kind: "character"
            character: "•"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 24
            color:
              kind: "token"
              token: "foreground"
          lineHeight: 1.22
          spaceAfterPt: 12
        -
          runs:
            -
              text: "Complete the join prompts; sign in if your room requires it."
          bullet:
            kind: "character"
            character: "•"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 24
            color:
              kind: "token"
              token: "foreground"
          lineHeight: 1.22
          spaceAfterPt: 12
        -
          runs:
            -
              text: "Keep Zoom open and join your assigned breakout room."
          bullet:
            kind: "character"
            character: "•"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 24
            color:
              kind: "token"
              token: "foreground"
          lineHeight: 1.22
          spaceAfterPt: 12
        -
          runs:
            -
              text: "Your host will demonstrate the online controls before play."
          bullet:
            kind: "character"
            character: "•"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 24
            color:
              kind: "token"
              token: "foreground"
          lineHeight: 1.22
          spaceAfterPt: 12
