format: "replit.sdm"
version: 1
size:
  width: 1920
  height: 1080
background:
  kind: "solid"
  color:
    kind: "token"
    token: "background"
theme:
  colors:
    background: "#F8F6F1"
    surface: "#FCFAF8"
    foreground: "#3D3129"
    muted: "#847062"
    accent: "#50A63F"
    secondary: "#B27334"
  fonts:
    display: "Outfit"
    body: "Nunito"
assets:
  moisture:
    src: "images/Captain_Nectar_1773283674655.jpg"
  action:
    src: "images/High_Heat_Gamble_1773283674657.jpg"
elements:
  -
    id: "headerBar"
    type: "shape"
    frame:
      x: 120
      y: 87
      width: 100
      height: 8
    geometry:
      kind: "preset"
      preset: "rect"
    fill:
      kind: "solid"
      color:
        kind: "token"
        token: "accent"
  -
    id: "chapter"
    type: "text"
    frame:
      x: 240
      y: 67
      width: 850
      height: 45
    body:
      paragraphs:
        -
          runs:
            -
              text: "COMPOST HEROES  /  OPEN PLAY"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 16
            weight: 700
            color:
              kind: "token"
              token: "muted"
          lineHeight: 1.25
  -
    id: "heading"
    type: "text"
    frame:
      x: 120
      y: 130
      width: 1680
      height: 200
    body:
      paragraphs:
        -
          runs:
            -
              text: "Let the cards guide your strategy"
          defaultRunStyle:
            font:
              kind: "token"
              token: "display"
            sizePt: 42
            weight: 700
            color:
              kind: "token"
              token: "foreground"
          lineHeight: 1.09
  -
    id: "footer"
    type: "text"
    frame:
      x: 120
      y: 1004
      width: 440
      height: 44
    body:
      paragraphs:
        -
          runs:
            -
              text: "A GREEN CAMPS PROJECT"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 16
            weight: 700
            color:
              kind: "token"
              token: "muted"
          lineHeight: 1.25
  -
    id: "page"
    type: "text"
    frame:
      x: 1660
      y: 1004
      width: 150
      height: 44
    body:
      paragraphs:
        -
          runs:
            -
              text: "07 / 12"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 16
            weight: 400
            color:
              kind: "token"
              token: "muted"
          lineHeight: 1.25
  -
    id: "cardRules"
    type: "text"
    frame:
      x: 120
      y: 325
      width: 850
      height: 640
    body:
      paragraphs:
        -
          runs:
            -
              text: "Heroes build your pile and may provide special abilities."
          bullet:
            kind: "character"
            character: "•"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 21
            color:
              kind: "token"
              token: "foreground"
          lineHeight: 1.22
          spaceAfterPt: 8
        -
          runs:
            -
              text: "Actions can help you, disrupt opponents, or change the table."
          bullet:
            kind: "character"
            character: "•"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 21
            color:
              kind: "token"
              token: "foreground"
          lineHeight: 1.22
          spaceAfterPt: 8
        -
          runs:
            -
              text: "Read each card: effects can change the normal rules."
          bullet:
            kind: "character"
            character: "•"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 21
            color:
              kind: "token"
              token: "foreground"
          lineHeight: 1.22
          spaceAfterPt: 8
        -
          runs:
            -
              text: "Ongoing effects stay active until removed or replaced."
          bullet:
            kind: "character"
            character: "•"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 21
            color:
              kind: "token"
              token: "foreground"
          lineHeight: 1.22
          spaceAfterPt: 8
        -
          runs:
            -
              text: "Complete the app’s guided choices before continuing."
          bullet:
            kind: "character"
            character: "•"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 21
            color:
              kind: "token"
              token: "foreground"
          lineHeight: 1.22
          spaceAfterPt: 8
  -
    id: "heroBackdrop"
    type: "shape"
    frame:
      x: 1040
      y: 340
      width: 335
      height: 465
    geometry:
      kind: "preset"
      preset: "roundRect"
      cornerRadius: 24
    fill:
      kind: "solid"
      color:
        kind: "token"
        token: "surface"
  -
    id: "actionBackdrop"
    type: "shape"
    frame:
      x: 1440
      y: 340
      width: 335
      height: 465
    geometry:
      kind: "preset"
      preset: "roundRect"
      cornerRadius: 24
    fill:
      kind: "solid"
      color:
        kind: "token"
        token: "surface"
  -
    id: "heroSample"
    type: "image"
    frame:
      x: 1059
      y: 362
      width: 300
      height: 418
    assetId: "moisture"
    fit: "contain"
  -
    id: "actionSample"
    type: "image"
    frame:
      x: 1459
      y: 362
      width: 300
      height: 418
    assetId: "action"
    fit: "contain"
  -
    id: "heroTag"
    type: "text"
    frame:
      x: 1080
      y: 834
      width: 290
      height: 62
    body:
      paragraphs:
        -
          runs:
            -
              text: "HERO"
          defaultRunStyle:
            font:
              kind: "token"
              token: "display"
            sizePt: 24
            weight: 700
            color:
              kind: "token"
              token: "accent"
          lineHeight: 1.09
  -
    id: "actionTag"
    type: "text"
    frame:
      x: 1480
      y: 834
      width: 290
      height: 62
    body:
      paragraphs:
        -
          runs:
            -
              text: "ACTION"
          defaultRunStyle:
            font:
              kind: "token"
              token: "display"
            sizePt: 24
            weight: 700
            color:
              kind: "token"
              token: "secondary"
          lineHeight: 1.09
