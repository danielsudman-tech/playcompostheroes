format: "replit.sdm"
version: 1
size:
  width: 1920
  height: 1080
background:
  kind: "solid"
  color:
    kind: "token"
    token: "background"
theme:
  colors:
    background: "#F8F6F1"
    surface: "#FCFAF8"
    foreground: "#3D3129"
    muted: "#847062"
    accent: "#50A63F"
    secondary: "#B27334"
  fonts:
    display: "Outfit"
    body: "Nunito"
assets:
  moisture:
    src: "images/Captain_Nectar_1773283674655.jpg"
elements:
  -
    id: "headerBar"
    type: "shape"
    frame:
      x: 120
      y: 87
      width: 100
      height: 8
    geometry:
      kind: "preset"
      preset: "rect"
    fill:
      kind: "solid"
      color:
        kind: "token"
        token: "accent"
  -
    id: "chapter"
    type: "text"
    frame:
      x: 240
      y: 67
      width: 850
      height: 45
    body:
      paragraphs:
        -
          runs:
            -
              text: "COMPOST HEROES  /  OPEN PLAY"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 16
            weight: 700
            color:
              kind: "token"
              token: "muted"
          lineHeight: 1.25
  -
    id: "heading"
    type: "text"
    frame:
      x: 120
      y: 130
      width: 1680
      height: 200
    body:
      paragraphs:
        -
          runs:
            -
              text: "Watch one turn before we play"
          defaultRunStyle:
            font:
              kind: "token"
              token: "display"
            sizePt: 42
            weight: 700
            color:
              kind: "token"
              token: "foreground"
          lineHeight: 1.09
  -
    id: "footer"
    type: "text"
    frame:
      x: 120
      y: 1004
      width: 440
      height: 44
    body:
      paragraphs:
        -
          runs:
            -
              text: "A GREEN CAMPS PROJECT"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 16
            weight: 700
            color:
              kind: "token"
              token: "muted"
          lineHeight: 1.25
  -
    id: "page"
    type: "text"
    frame:
      x: 1660
      y: 1004
      width: 150
      height: 44
    body:
      paragraphs:
        -
          runs:
            -
              text: "08 / 12"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 16
            weight: 400
            color:
              kind: "token"
              token: "muted"
          lineHeight: 1.25
  -
    id: "turnExample"
    type: "text"
    frame:
      x: 120
      y: 310
      width: 930
      height: 650
    body:
      paragraphs:
        -
          runs:
            -
              text: "Start with an empty Moisture slot."
          bullet:
            kind: "character"
            character: "•"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 20
            color:
              kind: "token"
              token: "foreground"
          lineHeight: 1.22
          spaceAfterPt: 10
        -
          runs:
            -
              text: "Draw, then play a Moisture Hero into that slot."
          bullet:
            kind: "character"
            character: "•"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 20
            color:
              kind: "token"
              token: "foreground"
          lineHeight: 1.22
          spaceAfterPt: 10
        -
          runs:
            -
              text: "Read and resolve its effect; play an Action if you choose."
          bullet:
            kind: "character"
            character: "•"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 20
            color:
              kind: "token"
              token: "foreground"
          lineHeight: 1.22
          spaceAfterPt: 10
        -
          runs:
            -
              text: "End your turn and follow any discard prompt."
          bullet:
            kind: "character"
            character: "•"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 20
            color:
              kind: "token"
              token: "foreground"
          lineHeight: 1.22
          spaceAfterPt: 10
        -
          runs:
            -
              text: "When your pile covers all five functions, you win."
          bullet:
            kind: "character"
            character: "•"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 20
            color:
              kind: "token"
              token: "foreground"
          lineHeight: 1.22
          spaceAfterPt: 10
  -
    id: "beforePanel"
    type: "shape"
    frame:
      x: 1110
      y: 380
      width: 290
      height: 420
    geometry:
      kind: "preset"
      preset: "roundRect"
      cornerRadius: 24
    fill:
      kind: "solid"
      color:
        kind: "token"
        token: "surface"
  -
    id: "afterPanel"
    type: "shape"
    frame:
      x: 1490
      y: 380
      width: 290
      height: 420
    geometry:
      kind: "preset"
      preset: "roundRect"
      cornerRadius: 24
    fill:
      kind: "solid"
      color:
        kind: "token"
        token: "surface"
  -
    id: "beforeLabel"
    type: "text"
    frame:
      x: 1110
      y: 294
      width: 320
      height: 70
    body:
      paragraphs:
        -
          runs:
            -
              text: "BEFORE: HAND"
          defaultRunStyle:
            font:
              kind: "token"
              token: "display"
            sizePt: 21
            weight: 700
            color:
              kind: "token"
              token: "secondary"
          lineHeight: 1.09
  -
    id: "afterLabel"
    type: "text"
    frame:
      x: 1490
      y: 294
      width: 320
      height: 70
    body:
      paragraphs:
        -
          runs:
            -
              text: "AFTER: PILE"
          defaultRunStyle:
            font:
              kind: "token"
              token: "display"
            sizePt: 21
            weight: 700
            color:
              kind: "token"
              token: "accent"
          lineHeight: 1.09
  -
    id: "beforeCard"
    type: "image"
    frame:
      x: 1130
      y: 402
      width: 250
      height: 370
    assetId: "moisture"
    fit: "contain"
  -
    id: "afterCard"
    type: "image"
    frame:
      x: 1510
      y: 402
      width: 250
      height: 370
    assetId: "moisture"
    fit: "contain"
  -
    id: "moveArrow"
    type: "text"
    frame:
      x: 1410
      y: 530
      width: 78
      height: 100
    body:
      paragraphs:
        -
          runs:
            -
              text: "→"
          defaultRunStyle:
            font:
              kind: "token"
              token: "display"
            sizePt: 40
            weight: 700
            color:
              kind: "token"
              token: "accent"
          lineHeight: 1.09
  -
    id: "slotLabel"
    type: "text"
    frame:
      x: 1450
      y: 835
      width: 360
      height: 130
    body:
      paragraphs:
        -
          runs:
            -
              text: "Moisture function slot"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 20
            weight: 700
            color:
              kind: "token"
              token: "accent"
          lineHeight: 1.25
