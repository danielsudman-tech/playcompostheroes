kind = "web"
previewPath = "/"
title = "Compost Heroes"
version = "1.0.0"
id = "artifacts/compost-heroes"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 19546
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/compost-heroes run dev"

[services.env]
PORT = "19546"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/compost-heroes", "run", "build"]
publicDir = "artifacts/compost-heroes/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
