openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Compost Heroes Game API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: game
    description: Game session operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /games:
    post:
      operationId: createGame
      tags: [game]
      summary: Create a new game session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGameRequest"
      responses:
        "201":
          description: Game created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameState"

  /games/{gameId}:
    get:
      operationId: getGame
      tags: [game]
      summary: Get game state
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Game state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameState"
        "404":
          description: Game not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /games/{gameId}/pause:
    post:
      operationId: pauseGame
      tags: [game]
      summary: Facilitator pauses or resumes a facilitated game (host token required)
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PauseGameRequest"
      responses:
        "200":
          description: Updated game state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameState"
        "403":
          description: Not the host
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Game not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /games/{gameId}/facilitator-resolve:
    post:
      operationId: facilitatorResolve
      tags: [game]
      summary: Facilitator resolves the current pending decision on behalf of a stuck player (host token required)
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FacilitatorResolveRequest"
      responses:
        "200":
          description: Updated game state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameState"
        "403":
          description: Not the host
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Game not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: No pending decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /games/{gameId}/action:
    post:
      operationId: performAction
      tags: [game]
      summary: Perform a game action
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameAction"
      responses:
        "200":
          description: Updated game state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameState"
        "400":
          description: Invalid action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Game not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    CreateGameRequest:
      type: object
      properties:
        playerNames:
          type: array
          items:
            type: string
          minItems: 2
          maxItems: 4
        mode:
          type: string
          enum: [facilitator, standalone, online, facilitated]
      required:
        - mode

    Card:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [hero, action]
        layer:
          type: string
          nullable: true
        effectType:
          type: string
          enum: [instant, ongoing]
        cardText:
          type: string
        factText:
          type: string
        function:
          type: string
        imageKey:
          type: string
          nullable: true
        baseId:
          type: string
        alternateFunctions:
          type: array
          items:
            type: string
        chosenFunction:
          type: string
      required:
        - id
        - name
        - type
        - layer
        - effectType
        - cardText
        - factText
        - function
        - imageKey

    PlayerState:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        hand:
          type: array
          items:
            $ref: "#/components/schemas/Card"
        compostPile:
          type: array
          items:
            $ref: "#/components/schemas/Card"
        skipsNextTurn:
          type: boolean
        maxHandSize:
          type: integer
        drawsExtraCard:
          type: boolean
        isBot:
          type: boolean
        botSkillLevel:
          type: string
          enum: [easy, medium, hard]
      required:
        - id
        - name
        - hand
        - compostPile
        - skipsNextTurn
        - maxHandSize
        - drawsExtraCard

    ActiveModifier:
      type: object
      properties:
        cardId:
          type: string
        cardName:
          type: string
        effect:
          type: string
        appliedByPlayerId:
          type: string
      required:
        - cardId
        - cardName
        - effect
        - appliedByPlayerId

    PendingDecision:
      type: object
      properties:
        type:
          type: string
        playerId:
          type: string
        cardId:
          type: string
        options:
          type: array
          items:
            type: object
            additionalProperties: true
        prompt:
          type: string
        meta:
          type: object
          additionalProperties: true
      required:
        - type
        - playerId
        - cardId
        - prompt

    EffectEvent:
      type: object
      properties:
        kind:
          type: string
          enum: [draw, discard, transfer, swap, skip, pile_shift, modifier, info]
        playerIds:
          type: array
          items:
            type: string
        text:
          type: string
      required:
        - kind
        - text

    EffectAnnouncement:
      type: object
      properties:
        id:
          type: string
        cardId:
          type: string
        cardName:
          type: string
        cardText:
          type: string
        imageKey:
          type: string
          nullable: true
        playedById:
          type: string
        playedByName:
          type: string
        outcome:
          type: array
          items:
            type: string
        events:
          type: array
          items:
            $ref: "#/components/schemas/EffectEvent"
      required:
        - id
        - cardId
        - cardName
        - cardText
        - imageKey
        - playedById
        - playedByName
        - outcome
        - events

    GameState:
      type: object
      properties:
        gameId:
          type: string
        mode:
          type: string
          enum: [facilitator, standalone, online, facilitated]
        phase:
          type: string
          enum: [waiting, setup, draw, play, effect_resolution, end_turn, game_over]
        currentPlayerIndex:
          type: integer
        players:
          type: array
          items:
            $ref: "#/components/schemas/PlayerState"
        deckCount:
          type: integer
        discardPile:
          type: array
          items:
            $ref: "#/components/schemas/Card"
        activeModifiers:
          type: array
          items:
            $ref: "#/components/schemas/ActiveModifier"
        pendingDecision:
          $ref: "#/components/schemas/PendingDecision"
          nullable: true
        lastEffect:
          $ref: "#/components/schemas/EffectAnnouncement"
          nullable: true
        log:
          type: array
          items:
            type: string
        winner:
          type: string
          nullable: true
        turnNumber:
          type: integer
        extraTurn:
          type: boolean
        heroPlayedThisTurn:
          type: boolean
        actionPlayedThisTurn:
          type: boolean
        ongoingActionCard:
          $ref: "#/components/schemas/Card"
          nullable: true
        ongoingBenefitUsedThisTurn:
          type: boolean
        maxPlayers:
          type: integer
        paused:
          type: boolean
        hasPassword:
          type: boolean
      required:
        - gameId
        - mode
        - phase
        - currentPlayerIndex
        - players
        - deckCount
        - discardPile
        - activeModifiers
        - pendingDecision
        - log
        - winner
        - turnNumber

    PauseGameRequest:
      type: object
      properties:
        token:
          type: string
        paused:
          type: boolean
      required:
        - token
        - paused

    FacilitatorResolveRequest:
      type: object
      properties:
        token:
          type: string
      required:
        - token

    GameAction:
      type: object
      properties:
        type:
          type: string
          enum:
            - draw_card
            - play_card
            - end_turn
            - resolve_decision
            - activate_ongoing
            - move_card_layer
            - reset_game
        playerId:
          type: string
        token:
          type: string
          nullable: true
        targetFunction:
          type: string
          nullable: true
        cardId:
          type: string
          nullable: true
        targetPlayerId:
          type: string
          nullable: true
        targetCardId:
          type: string
          nullable: true
        decisionData:
          type: object
          nullable: true
          additionalProperties: true
      required:
        - type
        - playerId
