openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Compost Heroes Game API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: game
    description: Game session operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Database readiness check
      description: Returns whether the API can acquire a database connection and execute a bounded SELECT 1 probe.
      responses:
        "200":
          description: Database is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: Database is unavailable or did not respond before the readiness deadline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /livez:
    get:
      operationId: livenessCheck
      tags: [health]
      summary: Process liveness check
      description: Returns whether the API process is responding without probing dependencies.
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessStatus"

  /admin/healthz:
    get:
      operationId: adminHealthCheck
      tags: [health]
      summary: Authorized database readiness and pool diagnostics
      description: Requires the x-admin-key header. Pool diagnostics are omitted from the public health endpoint. sinceMs filters acquisition wait metrics to the given recent lookback duration.
      parameters:
        - name: x-admin-key
          in: header
          required: true
          schema:
            type: string
        - name: sinceMs
          in: query
          required: false
          description: Recent lookback duration in milliseconds for acquisition wait metrics (not an epoch timestamp).
          schema:
            type: number
            minimum: 0
      responses:
        "200":
          description: Database is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminHealthStatus"
        "400":
          description: Invalid sinceMs lookback duration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Database unavailable or admin access is not configured
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AdminHealthStatus"
                  - $ref: "#/components/schemas/ErrorResponse"

  /admin/users/{userId}/facilitator:
    patch:
      operationId: approveFacilitator
      tags: [game]
      summary: Admin grants or revokes facilitator hosting access
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
        - name: x-admin-key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FacilitatorApproval"
      responses:
        "200":
          description: Updated role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FacilitatorRole"
        "401":
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/users/{userId}:
    delete:
      operationId: deleteAdminUser
      tags: [game]
      summary: Permanently delete a registered account and its sign-in sessions
      description: Past games and analytics events are retained.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
        - name: x-admin-key
          in: header
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Account deleted
        "401":
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /games:
    post:
      operationId: createGame
      tags: [game]
      summary: Create a new game session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGameRequest"
      responses:
        "201":
          description: Game created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedGameResponse"

  /games/{gameId}:
    get:
      operationId: getGame
      tags: [game]
      summary: Get game state
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
        - name: token
          in: query
          required: false
          description: Player token or reserved spectator-host token (player index -1 for new facilitated rooms, index 0 for legacy rooms).
          schema:
            type: string
      responses:
        "200":
          description: Game state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameState"
        "404":
          description: Game not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /games/{gameId}/players/{playerId}:
    delete:
      operationId: removeGamePlayer
      tags: [game]
      summary: Leave a waiting room or remove a participant
      description: Online rooms retain their existing waiting-room leave/kick behavior. In facilitated rooms, a participant may leave only while waiting; the approved creator must provide both their host seat token and user token to remove a participant. During active play the participant is converted to a bot in the same seat, with their game state preserved. Facilitator credentials cannot remove the legacy host, bots, or players from ended sessions.
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
        - name: playerId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GamePlayerRemovalInput"
      responses:
        "200":
          description: Player left, was removed, or was converted to a bot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GamePlayerRemovalResult"
        "400":
          description: Invalid removal request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Seat token required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Invalid token or insufficient facilitator authorization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Game or player not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Session ended or room changed during the request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /games/{gameId}/claim:
    post:
      operationId: claimGameSeat
      tags: [game]
      summary: Claim or recover a game seat
      description: An existing token only resumes the seat it already owns. Invalid tokens never claim another seat. If an existing token was transferred to another room, returns HTTP 409 with redirectGameId and targetToken.
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameSeatClaimInput"
      responses:
        "200":
          description: Existing seat recovered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameSeatClaimResult"
        "409":
          description: Existing token belongs to a different game, or no seat is available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameSeatClaimConflict"
        "403":
          description: Invalid existing token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /facilitator/rooms:
    get:
      operationId: getFacilitatorRooms
      tags: [game]
      summary: List sessions created by the signed-in facilitator
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FacilitatorRoomSummary"
        "401":
          description: Sign in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Facilitator approval required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /facilitator/events:
    get:
      operationId: getFacilitatorEvents
      tags: [game]
      summary: List events owned by the approved facilitator
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Facilitator events
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EventSummary" }
        "401": { description: Sign in required, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "403": { description: Approved facilitator required, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
    post:
      operationId: createFacilitatorEvent
      tags: [game]
      summary: Create an event and its facilitated game tables atomically
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventInput" }
      responses:
        "201":
          description: Created event with host spectator tokens
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventDetail" }
        "400": { description: Invalid event configuration, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "401": { description: Sign in required, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "403": { description: Approved facilitator required, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /facilitator/events/{eventId}:
    get:
      operationId: getFacilitatorEvent
      tags: [game]
      summary: Get an event control-center summary
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: string }
      security:
        - bearerAuth: []
      responses:
        "200": { description: Safe event detail, content: { application/json: { schema: { $ref: "#/components/schemas/EventDetail" } } } }
        "401": { description: Sign in required, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "403": { description: Not the approved creator, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "404": { description: Event not found, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
    patch:
      operationId: updateFacilitatorEvent
      tags: [game]
      summary: Edit event name or idle threshold
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventUpdate" }
      responses:
        "200": { description: Updated event, content: { application/json: { schema: { $ref: "#/components/schemas/EventDetail" } } } }
        "401": { description: Sign in required, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "403": { description: Not the approved creator, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "404": { description: Event not found, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /facilitator/events/{eventId}/control:
    post:
      operationId: controlFacilitatorEvent
      tags: [game]
      summary: Start, pause, resume, end, or message across event tables
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventControlInput" }
      responses:
        "200": { description: Event control results, content: { application/json: { schema: { $ref: "#/components/schemas/EventControlResult" } } } }
        "401": { description: Sign in required, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "403": { description: Not the approved creator, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "404": { description: Event not found, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /facilitator/events/{eventId}/tables/{gameId}/control:
    post:
      operationId: controlFacilitatorEventTable
      tags: [game]
      summary: Control a single event table
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: string }
        - name: gameId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventTableControlInput" }
      responses:
        "200": { description: Table result, content: { application/json: { schema: { $ref: "#/components/schemas/EventTableResult" } } } }
        "401": { description: Sign in required, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "403": { description: Not the approved creator, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "404": { description: Event or table not found, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /facilitator/events/{eventId}/stream-ticket:
    post:
      operationId: createFacilitatorEventStreamTicket
      tags: [game]
      summary: Create a short-lived, single-use ticket for the facilitator event stream
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventStreamTicketInput"
      responses:
        "200":
          description: One-time event stream ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventStreamTicket"
        "401": { description: Sign in required }
        "403": { description: Not the approved creator }
        "404": { description: Event not found }

  /facilitator/events/{eventId}/stream:
    get:
      operationId: streamFacilitatorEvent
      tags: [game]
      summary: SSE event detail updates using a short-lived, single-use ticket
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: string }
        - name: ticket
          in: query
          required: true
          schema: { type: string }
      responses:
        "200": { description: Server-sent event stream of EventDetail JSON }
        "401": { description: Sign in required }
        "403": { description: Not the approved creator }
        "404": { description: Event not found }

  /events/{code}:
    get:
      operationId: getPublicEvent
      tags: [game]
      summary: Public event lobby with safe table and seat summary
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Public event lobby, content: { application/json: { schema: { $ref: "#/components/schemas/PublicEvent" } } } }
        "404": { description: Event not found, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /events/{code}/join:
    post:
      operationId: joinEvent
      tags: [game]
      summary: Join an event table anonymously or resume using an existing seat token
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventJoinInput" }
      responses:
        "200": { description: Existing seat resumed, content: { application/json: { schema: { $ref: "#/components/schemas/EventJoinResult" } } } }
        "201": { description: Joined event table, content: { application/json: { schema: { $ref: "#/components/schemas/EventJoinResult" } } } }
        "400": { description: Invalid join request, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "404": { description: Event not found, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "409": { description: Event is not accepting joins or table is full, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /events/{code}/ready:
    post:
      operationId: setEventReady
      tags: [game]
      summary: Set the authenticated event seat's ready state
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventReadyInput" }
      responses:
        "200": { description: Updated readiness, content: { application/json: { schema: { $ref: "#/components/schemas/SuccessResponse" } } } }
        "403": { description: Invalid or non-event seat token, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /events/{code}/presence:
    post:
      operationId: heartbeatEventPresence
      tags: [game]
      summary: Refresh event guest presence heartbeat
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventPresenceInput" }
      responses:
        "200": { description: Heartbeat recorded, content: { application/json: { schema: { $ref: "#/components/schemas/SuccessResponse" } } } }
        "403": { description: Invalid or non-event seat token, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /games/{gameId}/host-token:
    post:
      operationId: recoverHostToken
      tags: [game]
      summary: Recover the facilitator token for a session's creator
      description: Returns the reserved player-index -1 host token for new spectator-host rooms, or player-index 0 for legacy rooms.
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HostTokenRecovery"
      responses:
        "200":
          description: Host seat token
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                required: [token]
        "403":
          description: Not the facilitator of this session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /games/{gameId}/message:
    post:
      operationId: sendHostMessage
      tags: [game]
      summary: Facilitator broadcasts a message to all tables (host token required)
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HostBroadcast"
      responses:
        "200":
          description: Updated game state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameState"
        "403":
          description: Not the host
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /games/{gameId}/question:
    post:
      operationId: askQuestion
      tags: [game]
      summary: Participant flags a question for the facilitator
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParticipantQuestion"
      responses:
        "200":
          description: Question recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required: [ok]
        "409":
          description: Player already has an open question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /games/{gameId}/question/{questionId}/resolve:
    post:
      operationId: resolveQuestion
      tags: [game]
      summary: Facilitator resolves a participant question (host token required)
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
        - name: questionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HostCredential"
      responses:
        "200":
          description: Updated game state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameState"
        "403":
          description: Not the host
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /games/{gameId}/end:
    post:
      operationId: endSession
      tags: [game]
      summary: Facilitator ends the session for everyone (host token required)
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HostCredential"
      responses:
        "200":
          description: Final game state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameState"
        "403":
          description: Not the host
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Game already over
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /games/{gameId}/pause:
    post:
      operationId: pauseGame
      tags: [game]
      summary: Facilitator pauses or resumes a facilitated game (host token required)
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PauseGameRequest"
      responses:
        "200":
          description: Updated game state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameState"
        "403":
          description: Not the host
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Game not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /games/{gameId}/facilitator-resolve:
    post:
      operationId: facilitatorResolve
      tags: [game]
      summary: Facilitator resolves the current pending decision on behalf of a stuck player (host token required)
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FacilitatorResolveRequest"
      responses:
        "200":
          description: Updated game state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameState"
        "403":
          description: Not the host
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Game not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: No pending decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /games/{gameId}/action:
    post:
      operationId: performAction
      tags: [game]
      summary: Perform a game action
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameAction"
      responses:
        "200":
          description: Updated game state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameState"
        "400":
          description: Invalid action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Game not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /games/{gameId}/waiting/reorder:
    post:
      operationId: reorderWaitingPlayers
      tags: [game]
      summary: Reorder participant seats in a facilitated waiting room
      description: Requires the approved facilitator account and its host token. playerIds must contain each participant ID exactly once; a legacy host seat is fixed and excluded. Returns the serialized room state. Seat tokens are remapped atomically with player order.
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WaitingRoomReorderInput"
      responses:
        "200":
          description: Updated serialized waiting-room state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameState"
        "403":
          description: Host authorization failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Room is no longer waiting or player IDs do not match
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /games/{gameId}/waiting/transfer:
    post:
      operationId: transferWaitingPlayer
      tags: [game]
      summary: Transfer a participant between facilitated waiting rooms
      description: Requires the approved facilitator account and host token. Both rooms must be waiting sessions owned by the same facilitator and the target must have space. The moved participant receives an SSE room_transfer event with data {gameId,targetToken}; the old stream is then disconnected and its token is invalid in the source room. Both rooms are broadcast after the atomic transfer.
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WaitingRoomTransferInput"
      responses:
        "200":
          description: Participant transferred
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitingRoomTransferResult"
        "403":
          description: Host authorization failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Rooms are incompatible or target room is full
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    EventStreamTicketInput:
      type: object
      properties:
        userToken: { type: string }
      required: [userToken]
    EventStreamTicket:
      type: object
      properties:
        ticket: { type: string }
      required: [ticket]
    EventInput:
      type: object
      properties:
        userToken: { type: string }
        name: { type: string, minLength: 1, maxLength: 100 }
        tableCount: { type: integer, minimum: 1, maximum: 10 }
        tableCapacities: { type: array, minItems: 1, maxItems: 10, items: { type: integer, minimum: 2, maximum: 4 } }
        idleSeconds: { type: integer, minimum: 30, maximum: 3600, default: 120 }
        assignmentMode: { type: string, enum: [choose, auto], default: auto }
      required: [userToken, name, tableCount]
    EventUpdate:
      type: object
      properties:
        userToken: { type: string }
        name: { type: string, minLength: 1, maxLength: 100 }
        idleSeconds: { type: integer, minimum: 30, maximum: 3600 }
        assignmentMode: { type: string, enum: [choose, auto] }
      required: [userToken]
    EventControlInput:
      type: object
      properties:
        userToken: { type: string }
        action: { type: string, enum: [start, pause_all, resume_all, end, message] }
        text: { type: string, maxLength: 300 }
      required: [userToken, action]
    EventTableControlInput:
      type: object
      properties:
        userToken: { type: string }
        action: { type: string, enum: [pause, resume, message] }
        text: { type: string, maxLength: 300 }
      required: [userToken, action]
    EventJoinInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        tableNumber: { type: integer, minimum: 1, maximum: 10 }
        existingToken: { type: string }
      required: [name]
    EventReadyInput:
      type: object
      properties:
        token: { type: string }
        ready: { type: boolean }
      required: [token, ready]
    EventPresenceInput:
      type: object
      properties:
        token: { type: string }
      required: [token]
    EventJoinResult:
      type: object
      properties:
        gameId: { type: string }
        token: { type: string }
        playerId: { type: string }
        playerName: { type: string }
        tableNumber: { type: integer }
      required: [gameId, token, playerId, playerName, tableNumber]
    SuccessResponse:
      type: object
      properties: { ok: { type: boolean } }
      required: [ok]
    EventSeatSummary:
      type: object
      additionalProperties: false
      properties:
        playerId: { type: string }
        playerName: { type: string }
        ready: { type: boolean }
        connected: { type: boolean }
        lastSeenAt: { type: ["number", "null"], description: Guest heartbeat time as Unix epoch milliseconds; null when never seen. }
      required: [playerId, playerName, ready, connected, lastSeenAt]
    EventTableSummary:
      type: object
      properties:
        gameId: { type: string }
        tableNumber: { type: integer }
        capacity: { type: integer }
        phase: { type: string }
        paused: { type: boolean }
        players: { type: array, items: { $ref: "#/components/schemas/EventSeatSummary" } }
        progress: { type: integer, minimum: 0, maximum: 5, description: Highest count of distinct win-condition compost components among players at this table. }
        currentTurnPlayerName: { type: ["string", "null"] }
        winner: { type: ["string", "null"] }
        pendingDecisionOwner: { type: ["string", "null"] }
        questions: { type: array, items: { type: object, additionalProperties: true } }
        lastMeaningfulActivityAt: { type: ["number", "null"] }
        attention: { type: array, items: { type: string } }
        message: { type: ["string", "null"] }
      required: [gameId, tableNumber, capacity, phase, paused, players, progress, currentTurnPlayerName, winner, pendingDecisionOwner, questions, lastMeaningfulActivityAt, attention, message]
    EventSummary:
      type: object
      properties:
        eventId: { type: string }
        code: { type: string }
        name: { type: string }
        status: { type: string, enum: [upcoming, active, ending, completed] }
        assignmentMode: { type: string, enum: [choose, auto] }
        idleSeconds: { type: integer }
        tableCount: { type: integer }
      required: [eventId, code, name, status, assignmentMode, idleSeconds, tableCount]
    EventDetail:
      allOf:
        - $ref: "#/components/schemas/EventSummary"
        - type: object
          properties:
            tables: { type: array, items: { $ref: "#/components/schemas/EventTableSummary" } }
            hostTokens: { type: object, additionalProperties: { type: string } }
          required: [tables]
    PublicEvent:
      type: object
      additionalProperties: false
      properties:
        code: { type: string }
        name: { type: string }
        status: { type: string, enum: [upcoming, active, ending, completed] }
        assignmentMode: { type: string, enum: [choose, auto] }
        tables:
          type: array
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            properties:
              tableNumber: { type: integer, minimum: 1, maximum: 10 }
              capacity: { type: integer, minimum: 2, maximum: 4 }
              occupied: { type: integer, minimum: 0, maximum: 4 }
              phase: { type: string, enum: [waiting, setup, draw, play, effect_resolution, end_turn, game_over] }
            required: [tableNumber, capacity, occupied, phase]
      required: [code, name, status, assignmentMode, tables]
    EventTableResult:
      type: object
      properties:
        gameId: { type: string }
        success: { type: boolean }
        error: { type: ["string", "null"] }
      required: [gameId, success, error]
    EventControlResult:
      type: object
      properties:
        eventId: { type: string }
        action: { type: string }
        results: { type: array, items: { $ref: "#/components/schemas/EventTableResult" } }
      required: [eventId, action, results]
    CreatedGameResponse:
      allOf:
        - $ref: "#/components/schemas/GameState"
        - type: object
          properties:
            creatorToken:
              type: ["string", "null"]
              description: Facilitated host token (player index -1); online creator token uses player index 0.

    WaitingRoomReorderInput:
      type: object
      properties:
        token:
          type: string
          description: Host token (player index -1 for new rooms, 0 for legacy rooms).
        userToken:
          type: string
        playerIds:
          type: array
          items:
            type: string
      required: [token, userToken, playerIds]

    GameSeatClaimInput:
      type: object
      properties:
        token:
          type: string
          description: Existing seat token. A token moved to another room receives a redirect response instead of claiming a new seat.
        password:
          type: string
        userToken:
          type: string

    GameSeatClaimResult:
      type: object
      properties:
        token:
          type: string
        playerIndex:
          type: integer
          description: Host recovery may return the reserved index -1.
        playerId:
          type: ["string", "null"]
        playerName:
          type: string
      required: [token, playerIndex, playerId, playerName]

    GameSeatClaimConflict:
      type: object
      properties:
        error:
          type: string
        redirectGameId:
          type: string
        targetToken:
          type: string

    WaitingRoomTransferInput:
      type: object
      properties:
        token:
          type: string
          description: Host token (player index -1 for new rooms, 0 for legacy rooms).
        userToken:
          type: string
        playerId:
          type: string
        targetGameId:
          type: string
      required: [token, userToken, playerId, targetGameId]

    WaitingRoomTransferResult:
      type: object
      properties:
        success:
          type: boolean
          enum: [true]
      required: [success]

    GamePlayerRemovalInput:
      type: object
      properties:
        token:
          type: string
          description: Requester's seat token. Facilitated hosts use the reserved -1 token in new rooms or index 0 in legacy rooms.
        userToken:
          type: string
          description: Required with the host seat token when a facilitator removes a player; optional for existing online leave/kick requests.
      required: [token]

    GamePlayerRemovalResult:
      type: object
      properties:
        success:
          type: boolean
          enum: [true]
      required: [success]

    HostTokenRecovery:
      type: object
      properties:
        userToken:
          type: string
      required: [userToken]

    HostCredential:
      type: object
      properties:
        token:
          type: string
        userToken:
          type: string
      required: [token, userToken]

    HostBroadcast:
      type: object
      properties:
        token:
          type: string
        userToken:
          type: string
        text:
          type: string
      required: [token, userToken, text]

    ParticipantQuestion:
      type: object
      properties:
        token:
          type: string
        text:
          type: string
      required: [token]

    FacilitatorApproval:
      type: object
      properties:
        approved:
          type: boolean
      required: [approved]

    FacilitatorRole:
      type: object
      properties:
        role:
          type: ["string", "null"]
      required: [role]

    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum: [ok, unavailable]
      required:
        - status

    AdminHealthStatus:
      type: object
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        pool:
          $ref: "#/components/schemas/PoolDiagnostics"
      required: [status, pool]

    LivenessStatus:
      type: object
      properties:
        status:
          type: string
          const: ok
      required:
        - status

    PoolDiagnostics:
      type: object
      properties:
        total:
          type: integer
          minimum: 0
        idle:
          type: integer
          minimum: 0
        waiting:
          type: integer
          minimum: 0
        acquisitionWait:
          $ref: "#/components/schemas/AcquisitionWaitDiagnostics"
      required: [total, idle, waiting, acquisitionWait]

    AcquisitionWaitDiagnostics:
      type: object
      properties:
        count:
          type: integer
          minimum: 0
        maxMs:
          type: number
          minimum: 0
        p95Ms:
          type: number
          minimum: 0
      required: [count, maxMs, p95Ms]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    CreateGameRequest:
      type: object
      properties:
        playerNames:
          type: array
          items:
            type: string
          minItems: 2
          maxItems: 4
        mode:
          type: string
          enum: [facilitator, standalone, online, facilitated]
        userToken:
          type: string
          description: Registered-account token. Required for online creation; an approved facilitator's token is required for facilitator and facilitated modes.
      required:
        - mode

    Card:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [hero, action]
        layer:
          type: string
          nullable: true
        effectType:
          type: string
          enum: [instant, ongoing]
        cardText:
          type: string
        factText:
          type: string
        function:
          type: string
        imageKey:
          type: string
          nullable: true
        baseId:
          type: string
        alternateFunctions:
          type: array
          items:
            type: string
        chosenFunction:
          type: string
      required:
        - id
        - name
        - type
        - layer
        - effectType
        - cardText
        - factText
        - function
        - imageKey

    PlayerState:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        hand:
          type: array
          items:
            $ref: "#/components/schemas/Card"
        compostPile:
          type: array
          items:
            $ref: "#/components/schemas/Card"
        skipsNextTurn:
          type: boolean
        maxHandSize:
          type: integer
        drawsExtraCard:
          type: boolean
        isBot:
          type: boolean
        botSkillLevel:
          type: string
          enum: [easy, medium, hard]
      required:
        - id
        - name
        - hand
        - compostPile
        - skipsNextTurn
        - maxHandSize
        - drawsExtraCard

    ActiveModifier:
      type: object
      properties:
        cardId:
          type: string
        cardName:
          type: string
        effect:
          type: string
        appliedByPlayerId:
          type: string
      required:
        - cardId
        - cardName
        - effect
        - appliedByPlayerId

    PendingDecision:
      type: object
      properties:
        type:
          type: string
        playerId:
          type: string
        cardId:
          type: string
        options:
          type: array
          items:
            type: object
            additionalProperties: true
        prompt:
          type: string
        meta:
          type: object
          additionalProperties: true
      required:
        - type
        - playerId
        - cardId
        - prompt

    EffectFact:
      type: object
      description: >
        Structured effect details. Card names and functions are populated only
        for cards that are already public in compost or discard zones. Hidden
        hand-card identities are provided only through viewer-scoped privateFacts.
      properties:
        kind:
          type: string
          enum:
            - draw
            - hand_discard
            - hand_transfer
            - hand_loss
            - pile_gain
            - pile_loss
            - pile_transfer
            - compost_to_hand
            - discard_to_hand
            - skip
            - pile_shift
            - slot_change
            - ongoing_set
            - ongoing_removed
        actorId:
          type: string
        playerIds:
          type: array
          description: Affected players, or source followed by recipient for a transfer.
          items:
            type: string
        count:
          type: integer
          minimum: 0
        cardName:
          type: string
        function:
          type: string
        previousFunction:
          type: string
        previousCardName:
          type: string
        sourcePlayerId:
          type: string
        targetPlayerId:
          type: string
      required: [kind, actorId, playerIds, count]

    EffectEvent:
      type: object
      properties:
        kind:
          type: string
          enum: [draw, discard, transfer, swap, skip, pile_shift, modifier, info]
        playerIds:
          type: array
          items:
            type: string
        text:
          type: string
        fact:
          $ref: "#/components/schemas/EffectFact"
      required:
        - kind
        - text

    EffectAnnouncement:
      type: object
      properties:
        id:
          type: string
        cardId:
          type: string
        cardName:
          type: string
        cardText:
          type: string
        imageKey:
          type: string
          nullable: true
        playedById:
          type: string
        playedByName:
          type: string
        verb:
          type: string
          enum: [played, activated, moved]
          description: Missing in announcements saved by older versions.
        players:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
            required: [id, name]
        outcome:
          type: array
          items:
            type: string
        privateEvents:
          description: Private effect details visible only to the viewer whose token owns the affected hand.
          type: array
          items:
            type: string
        privateFacts:
          description: >
            Structured hand-card details visible only to the viewer whose seat
            owns the affected hand. Never present to a spectator or other seat.
          type: array
          items:
            $ref: "#/components/schemas/EffectFact"
        events:
          type: array
          items:
            $ref: "#/components/schemas/EffectEvent"
      required:
        - id
        - cardId
        - cardName
        - cardText
        - imageKey
        - playedById
        - playedByName
        - outcome
        - events

    FacilitatorRoomSummary:
      type: object
      properties:
        gameId:
          type: string
        mode:
          type: string
        label:
          type: string
          nullable: true
        phase:
          type: string
        playerCount:
          type: integer
        maxPlayers:
          type: integer
        createdAt:
          type: number
          nullable: true
        endedAt:
          type: number
          nullable: true
        winner:
          type: string
          nullable: true
        paused:
          type: boolean
        openQuestions:
          type: integer
      required: [gameId, mode, phase, playerCount, maxPlayers, paused, openQuestions]

    QuestionFlag:
      type: object
      properties:
        id:
          type: string
        playerId:
          type: string
        playerName:
          type: string
        text:
          type: string
        ts:
          type: number
        resolved:
          type: boolean
      required: [id, playerId, playerName, text, ts, resolved]

    GameState:
      type: object
      properties:
        gameId:
          type: string
        eventId:
          type: string
          description: Owning event for an event table; absent for standalone games and legacy rooms.
        mode:
          type: string
          enum: [facilitator, standalone, online, facilitated]
        phase:
          type: string
          enum: [waiting, setup, draw, play, effect_resolution, end_turn, game_over]
        currentPlayerIndex:
          type: integer
        players:
          type: array
          items:
            $ref: "#/components/schemas/PlayerState"
        deckCount:
          type: integer
        discardPile:
          type: array
          items:
            $ref: "#/components/schemas/Card"
        activeModifiers:
          type: array
          items:
            $ref: "#/components/schemas/ActiveModifier"
        pendingDecision:
          $ref: "#/components/schemas/PendingDecision"
          nullable: true
        lastEffect:
          $ref: "#/components/schemas/EffectAnnouncement"
          nullable: true
        log:
          type: array
          items:
            type: string
        winner:
          type: string
          nullable: true
        turnNumber:
          type: integer
        extraTurn:
          type: boolean
        heroPlayedThisTurn:
          type: boolean
        actionPlayedThisTurn:
          type: boolean
        ongoingActionCard:
          $ref: "#/components/schemas/Card"
          nullable: true
        ongoingBenefitUsedThisTurn:
          type: boolean
        maxPlayers:
          type: integer
        paused:
          type: boolean
        hasPassword:
          type: boolean
        createdAt:
          type: number
          nullable: true
        endedAt:
          type: number
          nullable: true
        label:
          type: string
          nullable: true
        facilitatorId:
          type: string
          nullable: true
        hostIsSpectator:
          type: boolean
          description: True for new facilitated rooms where the host is a spectator outside player seats; absent on legacy rooms.
        endedByHost:
          type: boolean
        hostMessage:
          type: object
          nullable: true
          properties:
            id:
              type: string
            text:
              type: string
            ts:
              type: number
          required: [id, text, ts]
        questions:
          type: array
          items:
            $ref: "#/components/schemas/QuestionFlag"
      required:
        - gameId
        - mode
        - phase
        - currentPlayerIndex
        - players
        - deckCount
        - discardPile
        - activeModifiers
        - pendingDecision
        - log
        - winner
        - turnNumber

    PauseGameRequest:
      type: object
      properties:
        token:
          type: string
        userToken:
          type: string
        paused:
          type: boolean
      required: [token, userToken, paused]

    FacilitatorResolveRequest:
      type: object
      properties:
        token:
          type: string
        userToken:
          type: string
      required: [token, userToken]

    GameAction:
      type: object
      properties:
        type:
          type: string
          enum:
            - draw_card
            - play_card
            - end_turn
            - resolve_decision
            - activate_ongoing
            - move_card_layer
            - reset_game
        playerId:
          type: string
        token:
          type: string
          nullable: true
        userToken:
          type: string
          description: Required for facilitated reset actions.
        targetFunction:
          type: string
          nullable: true
        cardId:
          type: string
          nullable: true
        targetPlayerId:
          type: string
          nullable: true
        targetCardId:
          type: string
          nullable: true
        decisionData:
          type: object
          nullable: true
          additionalProperties: true
      required:
        - type
        - playerId
